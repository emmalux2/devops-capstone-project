---
- name: Configure Server & Deploy Container Applications
  hosts: webservers
  become: yes
  tasks:
    - name: Update apt package index
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - python3-pip
          - rsync
        state: present

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine & Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Synchronize project repository files to server
      synchronize:
        src: "../"
        dest: "/home/ubuntu/app"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=terraform"
    - name: Clone project repository
  ansible.builtin.git:
    repo: 'https://github.com/emmalux2/devops-capstone-project.git'
    dest: /home/ubuntu/devops-capstone-project
    version: main

- name: Debug - list project directory contents
  ansible.builtin.command:
    cmd: ls -la
    chdir: /home/ubuntu/devops-capstone-project
- name: Deploy applications using Docker Compose
  ansible.builtin.command:
    cmd: docker compose up -d --build
    chdir: /home/ubuntu/app
